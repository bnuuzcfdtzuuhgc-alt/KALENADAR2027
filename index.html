<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Настенный календарь 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, tactile, a real object on a real wall
   IDEA: an A3 wall calendar on wire-o binding, hanging on a nail; pages lift up and over the top
   PICTURE: the calendar itself, centred, with paper thickness, wire, hanger, cast shadow
   COLOUR and TYPE: sage-grey wall, white paper, ink black, weekend red; Unbounded + Manrope
   LAYOUT: calendar fills the first screen, controls and month strip under it */
:root{color-scheme:light dark;--bg:light-dark(#d5d9d2,#16181b);--ink:light-dark(#1b1c1e,#eceae6);--mute:light-dark(#5d625c,#9aa09a);--chip:light-dark(#ffffffb0,#ffffff14);--red:#d6402b;--paper:#fffdf9;--pink:#1b1c1e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(120% 80% at 50% 10%,light-dark(#e6e9e2,#24272b),var(--bg));color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;min-height:100svh}
main{display:flex;flex-direction:column;align-items:center;padding:56px 16px 32px;gap:22px}
.wall{position:relative;padding-top:clamp(36px,7vw,56px)}
.nail{position:absolute;left:50%;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9d9d9,#6b6b6b 60%,#3a3a3a);box-shadow:3px 4px 5px #0006;z-index:6}
.hanger{position:absolute;left:50%;top:6px;width:30%;transform:translateX(-50%);z-index:5;overflow:visible}
.cal{--w:min(92vw,520px,calc((100svh - 230px)*.707));position:relative;width:var(--w);aspect-ratio:297/420;container-type:inline-size;perspective:2400px;perspective-origin:50% -20%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.cal::before{content:"";position:absolute;inset:3% -2% -3% 2%;background:#000;filter:blur(18px);opacity:.28;border-radius:6px;transform:skewX(-1deg)}
.edge{position:absolute;left:.6%;right:.6%;bottom:-1.3cqw;height:1.6cqw;background:repeating-linear-gradient(#e8e4dc 0 1px,#fbf9f4 1px 3px);border-radius:0 0 3px 3px;box-shadow:0 2px 3px #0002}
.stack{position:absolute;inset:0;transform-style:preserve-3d}
.sheet{position:absolute;inset:0;transform-origin:50% 0;transform-style:preserve-3d;will-change:transform}
.sheet.gone{visibility:hidden}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border-radius:2px 2px 4px 4px;box-shadow:0 1px 2px #0002;overflow:hidden;color:#1b1c1e}
.face::before{content:"";position:absolute;left:2.4cqw;right:2.4cqw;top:1.1cqw;height:2cqw;background:radial-gradient(circle,#23252a 0 .55cqw,transparent .65cqw) 0 0/3cqw 2cqw repeat-x;z-index:2}
.back{transform:rotateX(180deg);background:repeating-linear-gradient(0deg,#0000 0 2.4cqw,#0000000a 2.4cqw calc(2.4cqw + 1px)),#f3f0ea}
.back span{position:absolute;inset:auto 0 6cqw;text-align:center;font:600 2.4cqw Manrope;color:#0003;letter-spacing:.02em}
.ph{position:absolute;left:4.5cqw;right:4.5cqw;top:5.2cqw;height:57%;background:#ddd;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{height:auto;bottom:4.5cqw}
.cover .t{position:absolute;left:4.5cqw;right:4.5cqw;bottom:4.5cqw;padding:7cqw 6cqw 6cqw;background:linear-gradient(transparent,#0009);color:#fff}
.cover b{display:block;font:800 21cqw/.9 Unbounded;letter-spacing:-.03em}
.cover small{display:block;font:600 3.4cqw Manrope;opacity:.9;margin-top:1.6cqw}
.mo{position:absolute;left:4.5cqw;right:4.5cqw;top:calc(57% + 7.6cqw);bottom:4cqw;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.35cqw solid #1b1c1e;padding-bottom:1.4cqw;margin-bottom:1.6cqw}
.mh h2{margin:0;font:800 6.6cqw/1 Unbounded;letter-spacing:-.02em;text-transform:uppercase}
.mh span{font:600 4cqw/1 Unbounded;color:var(--red)}
.days{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;flex:1;font:600 3.5cqw/1 Manrope;text-align:center;align-items:center}
.days i{font-style:normal;font-size:2.5cqw;font-weight:700;color:#6b6e72}
.days .w{color:var(--red)}
.days .o{color:#c8c8c8;font-weight:400}
.shade{position:absolute;inset:0;background:linear-gradient(#0000,#0005);opacity:0;pointer-events:none;z-index:1;border-radius:4px}
.binding{position:absolute;left:2.4cqw;right:2.4cqw;top:-1.6cqw;height:4cqw;display:flex;z-index:4;pointer-events:none}
.binding i{flex:1;display:flex;justify-content:center}
.binding i::before{content:"";width:1cqw;height:100%;border-radius:1cqw;background:linear-gradient(90deg,#6c6f75,#e6e8eb 45%,#3d4046);box-shadow:.3cqw .4cqw .5cqw #0005}
.binding i.gap::before{visibility:hidden}
.flip-up{animation:up .95s cubic-bezier(.42,.02,.28,1) forwards}
.flip-down{animation:up .95s cubic-bezier(.42,.02,.28,1) reverse forwards}
@keyframes up{0%{transform:rotateX(0)}12%{transform:rotateX(-4deg)}65%{transform:rotateX(140deg);opacity:1}100%{transform:rotateX(172deg);opacity:0}}
.cal.flipping .shade{animation:sh .95s ease}
@keyframes sh{0%,100%{opacity:0}35%{opacity:1}}
.bar{display:flex;align-items:center;gap:14px;width:min(92vw,560px)}
.bar output{flex:1;text-align:center;font:600 20px/1.2 Unbounded}
.bar output small{display:block;font:500 13px Manrope;color:var(--mute);margin-top:4px}
button,.up{font:600 15px Manrope;color:var(--ink);background:var(--chip);border:1px solid light-dark(#0001,#fff1);border-radius:999px;min-height:44px;padding:0 18px;cursor:pointer;backdrop-filter:blur(6px)}
.nav{width:48px;height:48px;padding:0;font-size:22px;flex:none}
button:hover,.up:hover{background:light-dark(#fff,#ffffff24)}
button:focus-visible,.up:focus-within{outline:3px solid var(--red);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:min(92vw,620px)}
.strip button{min-height:36px;padding:0 12px;font-size:13px}
.strip button[aria-current=true]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.up{display:inline-flex;align-items:center}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.note{font-size:13px;color:var(--mute);text-align:center;max-width:560px;margin:0}
@media (prefers-reduced-motion:reduce){.flip-up,.flip-down{animation-duration:.01s}.cal.flipping .shade{animation:none}}
@media(max-width:600px){main{padding-top:40px}.bar output{font-size:16px}}
</style>
</head>
<body>
<main>
  <div class="wall">
    <span class="nail"></span>
    <svg class="hanger" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M8 60 L50 4 L92 60" fill="none" stroke="#3d4046" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="cal" id="cal" role="region" aria-label="Настенный календарь 2027">
      <div class="edge"></div>
      <div class="stack" id="stack"></div>
      <div class="shade"></div>
      <div class="binding" id="binding"></div>
    </div>
  </div>

  <div class="bar">
    <button class="nav" id="prev" aria-label="Предыдущий лист">‹</button>
    <output id="lbl" aria-live="polite"></output>
    <button class="nav" id="next" aria-label="Следующий лист">›</button>
  </div>
  <div class="strip" id="strip"></div>
  <p class="note" id="note">Листать: клик по календарю, стрелки, свайп.</p>
</main>

<script src="config.js"></script>
<script>
{
const CFG = window.CALENDAR_CONFIG || {};
const YEAR = +CFG.YEAR || 2027;
const SB_URL = (CFG.SUPABASE_URL||'').replace(/\/$/,''), SB_KEY = CFG.SUPABASE_ANON_KEY||'', BUCKET = CFG.BUCKET||'calendar';

const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

/* ---------- пробные сцены (SVG) ---------- */
const PAL = [
  ['#1d3557','#a8c5e0','#f4f1de','#7d9cc0','#47668f','#eef4fa','#22394f','snow'],
  ['#e9a6b8','#fde8d7','#ffffff','#b9a3c8','#8c7aa8','#f6f1f8','#4e4466','snow'],
  ['#8fc1e3','#e6f2f7','#fff6c9','#94b8a8','#5f8a73','#b9cc8f','#2f5a45','pines'],
  ['#6fc0f5','#e3f6ff','#fffbe0','#8fd19e','#4fa06a','#a8e07d','#2e7a4a','flowers'],
  ['#ffc2d1','#fff1e6','#ffb4a2','#c6e2b5','#86b97a','#d8f0c0','#c75a7a','flowers'],
  ['#2f9cf0','#bfe6ff','#ffe066','#5fae7b','#2f8f5b','#9bd770','#1f6b43','pines'],
  ['#ff8a4c','#ffd29c','#fff1b8','#c46b5a','#8a3f4a','#2f6a8c','#1d4a66','sea'],
  ['#f6b93b','#fdf0c4','#ffffff','#e09f3e','#b5702a','#f2c14e','#9c6a1c','wheat'],
  ['#8ecae6','#f1f5e0','#ffd166','#d4a24c','#a3622a','#c9a04b','#b8562a','pines'],
  ['#d9583b','#f4a261','#ffe8b0','#9c3d2e','#5e2a2a','#b5542f','#7a2418','pines'],
  ['#8e99a4','#dfe3e6','#f1f1f1','#7d8790','#59636b','#8f8a7f','#3d4348','fog'],
  ['#0b1d3a','#2e4f7d','#fff6d5','#3b5b86','#24406a','#eef3fa','#1d3b33','night'],
  ['#14213d','#e07a5f','#ffe3b3','#5b4a7a','#33294f','#1c1733','#0f0c20','sea'] // обложка
];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ridge(r,base,amp,f){let d='M0 420 L0 '+base;const a=r()*9,b=r()*9;for(let x=0;x<=600;x+=15){const y=base-amp*(.55+.3*Math.sin(x*f+a)+.15*Math.sin(x*f*3.1+b));d+=` L${x} ${y.toFixed(1)}`}return d+' L600 420Z'}
function scene(i){
  const [t,b,sun,far,mid,gr,acc,kind]=PAL[i],r=rng(i*977+31);
  const sx=120+r()*360,sy=kind==='sea'?250:70+r()*70;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t}"/><stop offset="1" stop-color="${b}"/></linearGradient><radialGradient id="g"><stop offset="0" stop-color="${sun}" stop-opacity=".9"/><stop offset="1" stop-color="${sun}" stop-opacity="0"/></radialGradient><symbol id="p" viewBox="0 0 20 40"><path d="M10 0 L19 30 L1 30Z" fill="${acc}"/><rect x="8.5" y="30" width="3" height="10" fill="${acc}"/></symbol></defs><rect width="600" height="420" fill="url(#s)"/>`;
  if(kind==='night')for(let k=0;k<70;k++)s+=`<circle cx="${(r()*600).toFixed(0)}" cy="${(r()*200).toFixed(0)}" r="${(r()*1.6+.3).toFixed(1)}" fill="#fff" opacity="${(.4+r()*.6).toFixed(2)}"/>`;
  s+=`<circle cx="${sx}" cy="${sy}" r="110" fill="url(#g)"/><circle cx="${sx}" cy="${sy}" r="${kind==='night'?22:34}" fill="${sun}"/>`;
  s+=`<path d="${ridge(r,250,120,.009)}" fill="${far}"/>`;
  if(kind==='snow'||kind==='night')s+=`<path d="${ridge(r,250,120,.009)}" fill="#fff" opacity=".18"/>`;
  s+=`<path d="${ridge(r,300,80,.013)}" fill="${mid}"/>`;
  if(kind==='sea'){s+=`<rect y="270" width="600" height="150" fill="${gr}"/>`;for(let k=0;k<26;k++){const y=280+r()*130,x=r()*560;s+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${(20+r()*60).toFixed(0)}" height="2" rx="1" fill="${sun}" opacity="${(.25+r()*.5).toFixed(2)}"/>`}s+=`<rect x="${sx-30}" y="272" width="60" height="140" fill="${sun}" opacity=".18"/>`}
  else s+=`<path d="${ridge(r,350,50,.008)}" fill="${gr}"/>`;
  if(kind==='fog')s+=`<rect width="600" height="420" fill="#e8ecef" opacity=".35"/>`;
  if(['pines','snow','night','fog'].includes(kind))for(let k=0;k<16;k++){const h=40+r()*70,x=r()*600;s+=`<use href="#p" x="${x.toFixed(0)}" y="${(400-h).toFixed(0)}" width="${h/2}" height="${h}"/>`}
  if(kind==='flowers')for(let k=0;k<90;k++)s+=`<circle cx="${(r()*600).toFixed(0)}" cy="${(345+r()*75).toFixed(0)}" r="${(2+r()*3).toFixed(1)}" fill="${r()>.5?acc:'#fff'}"/>`;
  if(kind==='wheat')for(let k=0;k<120;k++){const x=r()*600,y=360+r()*60;s+=`<path d="M${x.toFixed(0)} ${y.toFixed(0)} l${(r()*6-3).toFixed(1)} -${(18+r()*16).toFixed(0)}" stroke="${acc}" stroke-width="1.6" opacity=".7"/>`}
  if(kind==='snow'||kind==='night')for(let k=0;k<60;k++)s+=`<circle cx="${(r()*600).toFixed(0)}" cy="${(r()*420).toFixed(0)}" r="${(r()*2+.8).toFixed(1)}" fill="#fff" opacity=".8"/>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s+'</svg>');
}
const TEST = Array.from({length:13},(_,k)=>scene(k===0?12:k-1)); // 0 = обложка
let REMOTE = [];
async function fetchPages(){
  if(!SB_URL||!SB_KEY)return;
  try{
    const r=await fetch(`${SB_URL}/rest/v1/calendar_pages?select=slot,path&year=eq.${YEAR}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!r.ok)throw new Error(r.status);
    (await r.json()).forEach(p=>REMOTE[p.slot]=`${SB_URL}/storage/v1/object/public/${BUCKET}/${p.path.split('/').map(encodeURIComponent).join('/')}`);
  }catch(e){console.warn('Supabase: не удалось загрузить листы, показываю пробные',e)}
}
const remote = k => REMOTE[k]||'';

/* ---------- листы ---------- */
function monthGrid(m){
  const first=(new Date(YEAR,m,1).getDay()+6)%7,len=new Date(YEAR,m+1,0).getDate(),prevLen=new Date(YEAR,m,0).getDate();
  let h=WD.map((d,k)=>`<i class="${k>4?'w':''}">${d}</i>`).join('');
  for(let c=0;c<42;c++){const d=c-first+1,wk=c%7>4;
    if(d<1)h+=`<span class="o">${prevLen+d}</span>`;else if(d>len)h+=`<span class="o">${d-len}</span>`;else h+=`<span class="${wk?'w':''}">${d}</span>`}
  return h;
}
const N=13,stack=document.getElementById('stack'),cal=document.getElementById('cal');
stack.innerHTML=Array.from({length:N},(_,k)=>{
  const front=k===0
    ?`<div class="face cover"><div class="ph"><img alt="Обложка" data-k="0"></div><div class="t"><b>${YEAR}</b><small>Настенный календарь</small></div></div>`
    :`<div class="face"><div class="ph"><img alt="${MONTHS[k-1]}" data-k="${k}"></div><div class="mo"><div class="mh"><h2>${MONTHS[k-1]}</h2><span>${YEAR}</span></div><div class="days">${monthGrid(k-1)}</div></div></div>`;
  return `<div class="sheet" style="z-index:${N-k}">${front}<div class="face back"><span>${YEAR}</span></div></div>`;
}).join('');
const sheets=[...stack.children],imgs=[...stack.querySelectorAll('img')];
document.getElementById('binding').innerHTML=Array.from({length:32},(_,k)=>`<i class="${k===15||k===16?'gap':''}"></i>`).join('');

function loadImages(){
  imgs.forEach(img=>{const k=+img.dataset.k,src=remote(k)||TEST[k];
    img.onerror=()=>{img.onerror=null;img.src=TEST[k]};img.src=src});
}
fetchPages().then(loadImages);

/* ---------- перелистывание ---------- */
let cur=0,busy=false;
const lbl=document.getElementById('lbl'),strip=document.getElementById('strip'),prev=document.getElementById('prev'),next=document.getElementById('next');
const name=k=>k===0?'Обложка':MONTHS[k-1];
strip.innerHTML=Array.from({length:N},(_,k)=>`<button data-k="${k}">${k===0?'Обложка':MONTHS[k-1].slice(0,3)}</button>`).join('');
function ui(){
  lbl.innerHTML=`${name(cur)}${cur?' '+YEAR:''}<small>лист ${cur+1} из ${N}</small>`;
  prev.disabled=cur===0;next.disabled=cur===N-1;
  strip.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',+b.dataset.k===cur));
}
function step(d){
  return new Promise(res=>{
    const n=cur+d;if(n<0||n>=N)return res(false);
    const el=d>0?sheets[cur]:sheets[n];
    if(d<0)el.classList.remove('gone');
    cal.classList.remove('flipping');void cal.offsetWidth;cal.classList.add('flipping');
    el.classList.add(d>0?'flip-up':'flip-down');
    cur=n;ui();
    el.addEventListener('animationend',()=>{el.classList.remove('flip-up','flip-down');if(d>0)el.classList.add('gone');res(true)},{once:true});
  });
}
async function go(d){if(busy)return;busy=true;await step(d);busy=false}
async function goto(t){if(busy||t===cur)return;busy=true;
  const d=t>cur?1:-1,far=Math.abs(t-cur)>1;
  if(far)sheets.forEach(s=>s.style.animationDuration='.42s');
  while(cur!==t)await step(d);
  sheets.forEach(s=>s.style.animationDuration='');busy=false}

prev.addEventListener('click',()=>go(-1));
next.addEventListener('click',()=>go(1));
strip.addEventListener('click',e=>{const b=e.target.closest('button');if(b)goto(+b.dataset.k)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')go(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1)});

let sx=0,sy=0,moved=false;
cal.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false});
cal.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>40||Math.abs(dy)>40){moved=true;(dy<-40||dx<-40)?go(1):go(-1)}});
cal.addEventListener('click',e=>{if(moved)return;const r=cal.getBoundingClientRect();go(e.clientY-r.top<r.height*.25?-1:1)});

ui();
}
</script>
</body>
</html>
